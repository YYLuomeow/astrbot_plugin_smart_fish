<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>决策结果</title>
    <style>
      :root {
        --bg: #f7f8fa;
        --card: #ffffff;
        --border: #e3e6eb;
        --text: #1a1a1a;
        --muted: #6b7280;
        --accent: #2f6fed;
        --ok: #12805c;
        --ok-bg: #e6f6ef;
        --no: #8b5e00;
        --no-bg: #fdf3df;
        --err: #b3261e;
        --err-bg: #fdeceb;
        --pre: #f3f4f6;
      }

      [data-theme="dark"] {
        --bg: #14161a;
        --card: #1c1f25;
        --border: #2c313a;
        --text: #e6e8eb;
        --muted: #9aa1ac;
        --accent: #6f9dff;
        --ok: #4ed6a8;
        --ok-bg: #16362c;
        --no: #e5b45a;
        --no-bg: #3a2f18;
        --err: #ff8a80;
        --err-bg: #3d1f1d;
        --pre: #101216;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px 24px 40px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }

      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      button {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      button.danger:hover {
        border-color: var(--err);
        color: var(--err);
      }

      .switch {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
      }

      .status {
        margin: 8px 0 16px;
        color: var(--muted);
        font-size: 13px;
      }

      .card {
        margin-bottom: 12px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-left: 4px solid var(--border);
        border-radius: 10px;
        background: var(--card);
      }

      .card.ok {
        border-left-color: var(--ok);
      }

      .card.no {
        border-left-color: var(--no);
      }

      .card.error {
        border-left-color: var(--err);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .badge {
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--pre);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .badge.result-ok {
        background: var(--ok-bg);
        color: var(--ok);
      }

      .badge.result-no {
        background: var(--no-bg);
        color: var(--no);
      }

      .badge.result-error {
        background: var(--err-bg);
        color: var(--err);
      }

      time,
      .metric {
        color: var(--muted);
        font-size: 12px;
      }

      .metric {
        font-variant-numeric: tabular-nums;
      }

      .sender {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        word-break: break-all;
      }

      .sender strong {
        color: var(--text);
        font-weight: 600;
      }

      .bar {
        position: relative;
        height: 6px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--pre);
      }

      .bar > span {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--accent);
      }

      .bar > i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--text);
      }

      .error-text {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--err-bg);
        color: var(--err);
        font-size: 13px;
        word-break: break-all;
      }

      .block {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--pre);
      }

      .block h4 {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .block p {
        margin: 0;
        max-height: 240px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .block.reply {
        background: var(--ok-bg);
      }

      .detail-btn {
        margin-top: 10px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--accent);
        font-size: 12px;
        cursor: pointer;
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        padding: 24px;
        background: rgba(0, 0, 0, 0.45);
        overflow: auto;
      }

      .modal.open {
        display: block;
      }

      .modal-box {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 20px 20px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
      }

      .modal-head {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .modal-head h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .modal-meta {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
        word-break: break-all;
      }

      .detail-grid {
        display: grid;
        gap: 12px;
      }

      @media (min-width: 960px) {
        .detail-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .detail-grid h3 {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      pre {
        margin: 0;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--pre);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono",
          monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 260px;
        overflow: auto;
      }

      .empty {
        padding: 48px 0;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>决策结果</h1>
        <p class="subtitle" id="settings">读取配置中…</p>
      </div>
      <div class="actions">
        <label class="switch">
          <input type="checkbox" id="auto" checked />
          自动刷新
        </label>
        <button type="button" id="refresh">刷新</button>
        <button type="button" id="clear" class="danger">清空记录</button>
      </div>
    </header>
    <p class="status" id="status">加载中…</p>
    <main id="list"></main>
    <div class="modal" id="modal">
      <div class="modal-box">
        <div class="modal-head">
          <h2>请求参数与原始返回</h2>
          <button type="button" id="modal-close">关闭</button>
        </div>
        <p class="modal-meta" id="modal-meta"></p>
        <div class="detail-grid" id="modal-body"></div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
